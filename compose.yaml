# The service with Docker alone, for a machine without Node.js 24.
#
#   docker compose up --build                       http://127.0.0.1:8787
#   PORT=9000 docker compose up --build             on another port
#   docker compose run --rm app npm test            the tests; npm run typecheck and npm run eval likewise
#
# For running locally: the port is published on this machine's loopback address only.
services:
  app:
    build: .
    # Passes Ctrl+C on to the service, which would not receive it as the container's first process.
    init: true
    command: ["node", "src/service/serve.ts", "--host", "0.0.0.0", "--port", "${PORT:-8787}"]
    ports:
      - "127.0.0.1:${PORT:-8787}:${PORT:-8787}"
